name: syngps-service
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - fastapi
  - uvicorn
  - pydantic
  - pydantic-settings
  - rdkit=2025.03.2
  - numpy
  - networkx
  - pandas
  - neo4j-python-driver=5.22.0
  - xgboost=2.0.3
  - pymongo=4.8.0
  - requests
  - cryptography
  - grpcio 
  - grpcio-tools
  - pip
  - pip:
    - drfp
    - svgutils
    # Install revision-0501 branch of syngps which includes the latest changes to the API and the new graph database schema
    # TODO : Update to the latest version of syngps once the changes in revision-0501 are merged into the main branch
    - git+https://github.com/ncats/syngps.git@revision-0501
